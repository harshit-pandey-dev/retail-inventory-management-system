version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: retail-inventory-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retail_inventory}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-retail_inventory}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - retail-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: retail-inventory-backend
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-retail_inventory}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    networks:
      - retail-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: retail-inventory-frontend
    restart: on-failure
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - retail-network

volumes:
  postgres_data:

networks:
  retail-network:
    driver: bridge
